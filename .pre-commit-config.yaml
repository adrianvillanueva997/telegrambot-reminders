# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        name: ⚙️ Check YAML
        args: [--allow-multiple-documents]
      - id: check-toml
        name: ⚙️ Check TOML
      - id: end-of-file-fixer
        name: ⚙️ End of file fixer
      - id: trailing-whitespace
        name: ⚙️ Trailing whitespace remover
      - id: check-case-conflict
        name: ⚙️ Check case conflict
      - id: check-docstring-first
        name: ⚙️ Check docstring first
      - id: check-merge-conflict
        name: ⚙️ Check merge conflict
      - id: detect-private-key
        name: ⚙️ Detect private key
      - id: debug-statements
        name: "⚙️ Check debug statements"

  - repo: https://github.com/hadolint/hadolint
    rev: v2.13.0-beta
    hooks:
      - id: hadolint
        name: 🐳 Lint Dockerfiles

  - repo: local
    hooks:
      - id: lint
        name: Biome and Oxlint
        entry: pnpm lint
        language: system
        pass_filenames: false
        always_run: true
      - id: format-check
        name: Oxfmt
        entry: pnpm format:check
        language: system
        pass_filenames: false
        always_run: true
      - id: typecheck
        name: TypeScript
        entry: pnpm exec tsc --noEmit
        language: system
        pass_filenames: false
        always_run: true
